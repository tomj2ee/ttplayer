name: Native C++ Player
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths: ['cpp/**', 'src/main/resources/**', '.github/workflows/native-player.yml']
  pull_request:
    paths: ['cpp/**', 'src/main/resources/**', '.github/workflows/native-player.yml']
jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: bash cpp/build-macos.sh '${{ matrix.arch }}'
      - name: Inspect bundle and package
        run: |
          plutil -lint cpp/out/macos-${{ matrix.arch }}/TTPlayer.app/Contents/Info.plist
          file cpp/out/macos-${{ matrix.arch }}/TTPlayer.app/Contents/MacOS/TTPlayer
          bash cpp/package-macos.sh '${{ matrix.arch }}'
      - name: Smoke test packaged app
        env:
          TTPLAYER_ARCH: ${{ matrix.arch }}
        run: |
          archive=$(find cpp/out/release -maxdepth 1 -name '*.zip' -print -quit)
          mkdir -p "$RUNNER_TEMP/ttplayer"
          ditto -x -k "$archive" "$RUNNER_TEMP/ttplayer"
          app=$(find "$RUNNER_TEMP/ttplayer" -name TTPlayer.app -maxdepth 3 -print -quit)
          if [ "$(uname -m)" != "$TTPLAYER_ARCH" ]; then
            echo 'Cross-built architecture; startup requires a matching Mac.'
            exit 0
          fi
          "$app/Contents/MacOS/TTPlayer" --config-dir "$RUNNER_TEMP/player-config" --quit-after 1500
      - uses: actions/upload-artifact@v4
        with:
          name: TTPlayer-macOS-${{ matrix.arch }}
          path: |
            cpp/out/release/*.zip
            cpp/out/release/*.dmg
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build Windows GUI
        shell: pwsh
        run: ./cpp/build.ps1
      - name: Check native startup and package
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./cpp/out/bin-complete/ttplayer_cpp.exe -ArgumentList "--config-dir `"$env:RUNNER_TEMP/player-config`" --quit-after 1500" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Windows startup failed' }
          ./cpp/tests/run-single-file-tests.ps1 -Executable out/bin-complete/ttplayer_cpp.exe
          ./cpp/package.ps1 -IncludeRelinkObjects
      - uses: actions/upload-artifact@v4
        with:
          name: TTPlayer-Windows-x64
          path: cpp/out/release/*.zip
