# =========================================================
# TTPlayer CI/CD Build Workflow / 多平台构建工作流
# =========================================================
# Triggers / 触发条件：
#   - Push to main/master
#   - Push v* tag (e.g. v1.0.0) → additional GitHub Release (fat jars + jpackage native installers & app bundles)
#   - Pull request
#   - Manual trigger (workflow_dispatch)
# =========================================================
name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # -------------------------------------------------------
  # build: produce fat jars for all platforms / 产出全部平台 fat jar
  # Single ubuntu runner with -P all yields every platform jar at once
  # (FFmpeg/JavaCPP natives are pre-built classifiers downloaded from
  #  Maven Central — no real per-platform runners needed.)
  # 单台 ubuntu runner 通过 -P all 一次产出全部平台 fat jar
  # （FFmpeg/JavaCPP 原生库是预编译 classifier，从 Maven 中央仓库下载，无需真实各平台 runner）
  # -------------------------------------------------------
  build:
    name: Build jars (macOS · Linux · Windows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build all-platform fat jars / 构建全部平台 fat jar
        run: mvn -B -P all -DskipTests package

      - name: List produced jars / 列出产物 jar
        run: ls -lh target/*.jar

      - name: Collect platform jars / 收集各平台 jar
        # Keep only runnable fat jars with a platform classifier
        # (e.g. ttplayer-1.0.0-<platform>.jar); drop the plain main jar
        # (ttplayer-*.jar, no natives, not directly runnable).
        # 只收集带平台 classifier 的可执行 fat jar（形如 ttplayer-1.0.0-<平台>.jar），
        # 排除不带 classifier 的主 jar（不含原生库、不可直接运行）。
        run: |
          mkdir -p target/collect
          for jar in target/ttplayer-*.jar; do
            [[ "$jar" == *"-macosx-x86_64.jar" || "$jar" == *"-macosx-arm64.jar" \
            || "$jar" == *"-windows-x86_64.jar" || "$jar" == *"-linux-x86_64.jar" \
            || "$jar" == *"-linux-arm64.jar" ]] && cp "$jar" target/collect/
          done
          ls -lh target/collect/

      # Split into one artifact per platform so each package runner only
      # downloads its own single jar / 按平台拆分成独立 artifact，
      # 每个 package runner 只下载自己平台的 1 个 jar
      - name: Upload jar (macOS Intel)
        uses: actions/upload-artifact@v4
        with:
          name: ttplayer-jar-macosx-x86_64
          path: target/collect/ttplayer-1.0.0-macosx-x86_64.jar
          if-no-files-found: error

      - name: Upload jar (macOS ARM)
        uses: actions/upload-artifact@v4
        with:
          name: ttplayer-jar-macosx-arm64
          path: target/collect/ttplayer-1.0.0-macosx-arm64.jar
          if-no-files-found: error

      - name: Upload jar (Windows x64)
        uses: actions/upload-artifact@v4
        with:
          name: ttplayer-jar-windows-x86_64
          path: target/collect/ttplayer-1.0.0-windows-x86_64.jar
          if-no-files-found: error

      - name: Upload jar (Linux x64)
        uses: actions/upload-artifact@v4
        with:
          name: ttplayer-jar-linux-x86_64
          path: target/collect/ttplayer-1.0.0-linux-x86_64.jar
          if-no-files-found: error

      - name: Upload jar (Linux ARM)
        uses: actions/upload-artifact@v4
        with:
          name: ttplayer-jar-linux-arm64
          path: target/collect/ttplayer-1.0.0-linux-arm64.jar
          if-no-files-found: error

  # -------------------------------------------------------
  # package: jpackage native installers + app bundles / jpackage 原生安装包与免安装包
  # jpackage is platform-bound — installers must be built on the target
  # platform's runner, so we use a matrix. Only runs on v* tags
  # (build job already made the jars on every push).
  # jpackage 不能跨平台，必须在目标平台 runner 上构建，故使用矩阵。
  # 仅打 v* 标签时构建（jar 构建每次 push 都在 build job 完成，这里不再重复）。
  # -------------------------------------------------------
  package:
    name: Package ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # Windows x64 → .msi + .exe
            platform: windows-x86_64
          # macOS Intel (macosx-x86_64) no longer uses jpackage — its jar is
          # published directly / macOS Intel 不再打 dmg，直接发布 jar
          - os: macos-14         # macOS Apple Silicon → .dmg
            platform: macosx-arm64
          - os: ubuntu-latest    # Linux x64 → .deb
            platform: linux-x86_64
          - os: ubuntu-24.04-arm # Linux ARM64 → .deb
            platform: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jpackage binds to the platform & JDK: building with JDK 25 ships a JDK 25 runtime.
      # setup-java installs a matching-architecture JDK (arm64 runner → arm64 JDK).
      # jpackage 绑定平台与 JDK 版本：用 JDK 25 打包，安装包内附带的运行时即 JDK 25；
      # setup-java 会按 runner 架构安装对应 JDK。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Download only this platform's 1 fat jar as jpackage --input
      # / 只下载本平台的 1 个 fat jar 作为 jpackage --input，不带其他平台 jar
      - name: Download matching fat jar / 下载本平台 fat jar
        uses: actions/download-artifact@v4
        with:
          name: ttplayer-jar-${{ matrix.platform }}
          path: input

      - name: Prepare icon (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # cygpath converts the git-bash path to a native Windows path (D:\a\...) so jpackage can read it
          # / cygpath 把 git-bash 路径转成 Windows 原生路径（D:\a\...），jpackage 才能识别
          echo "ICON=$(cygpath -w "$(pwd)/src/main/resources/ico/TTPlayer.ico")" >> $GITHUB_ENV

      - name: Prepare icon (Linux)
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          echo "ICON=$(pwd)/src/main/resources/ico/ttplayer_48x48_32bpp.png" >> $GITHUB_ENV
          # fakeroot is required by jpackage to build .deb / jpackage 打 .deb 依赖 fakeroot
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot

      - name: Prepare icon (macOS, generate .icns)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          # Generate a multi-size .icns from the 48x48 PNG / 由 48x48 PNG 生成多尺寸 .icns
          cd src/main/resources/ico
          mkdir -p icon.iconset
          sips -z 16 16   ttplayer_48x48_32bpp.png --out icon.iconset/icon_16x16.png       >/dev/null
          sips -z 32 32   ttplayer_48x48_32bpp.png --out icon.iconset/icon_16x16@2x.png    >/dev/null
          sips -z 32 32   ttplayer_48x48_32bpp.png --out icon.iconset/icon_32x32.png       >/dev/null
          sips -z 64 64   ttplayer_48x48_32bpp.png --out icon.iconset/icon_32x32@2x.png    >/dev/null
          sips -z 128 128 ttplayer_48x48_32bpp.png --out icon.iconset/icon_128x128.png     >/dev/null
          sips -z 256 256 ttplayer_48x48_32bpp.png --out icon.iconset/icon_128x128@2x.png  >/dev/null
          sips -z 256 256 ttplayer_48x48_32bpp.png --out icon.iconset/icon_256x256.png     >/dev/null
          sips -z 512 512 ttplayer_48x48_32bpp.png --out icon.iconset/icon_256x256@2x.png  >/dev/null
          sips -z 512 512 ttplayer_48x48_32bpp.png --out icon.iconset/icon_512x512.png     >/dev/null
          sips -z 1024 1024 ttplayer_48x48_32bpp.png --out icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns icon.iconset -o TTPlayer.icns
          echo "ICON=$(pwd)/TTPlayer.icns" >> $GITHUB_ENV

      # Windows .msi/.exe produced by jpackage depend on the WiX toolset
      # / Windows 的 msi/exe 由 jpackage 生成，依赖 WiX 工具集
      - name: Install WiX (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install wixtoolset -y --no-progress
          WIX_DIR=$(ls -d "/c/Program Files (x86)/WiX Toolset v3."* | head -1)
          echo "WIX=$WIX_DIR" >> $GITHUB_ENV

      - name: Package installers and app bundles / 打安装包与免安装包
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ICON: ${{ env.ICON }}
        run: |
          mkdir -p pkg_out app_out

          # ===== Installers / 安装包：Windows .msi + .exe；macOS .dmg；Linux .deb =====
          if [[ "$PLATFORM" == windows-* ]]; then
            jpackage --type msi --name TTPlayer --app-version 1.0.0 \
              --input input --main-jar "ttplayer-1.0.0-${PLATFORM}.jar" \
              --main-class org.ttplayer.Main --icon "$ICON" \
              --win-menu --win-shortcut --dest pkg_out
            jpackage --type exe --name TTPlayer --app-version 1.0.0 \
              --input input --main-jar "ttplayer-1.0.0-${PLATFORM}.jar" \
              --main-class org.ttplayer.Main --icon "$ICON" \
              --win-menu --win-shortcut --dest pkg_out
          elif [[ "$PLATFORM" == macosx-* ]]; then
            jpackage --type dmg --name TTPlayer --app-version 1.0.0 \
              --input input --main-jar "ttplayer-1.0.0-${PLATFORM}.jar" \
              --main-class org.ttplayer.Main --icon "$ICON" --dest pkg_out
          else
            jpackage --type deb --name ttplayer --app-version 1.0.0 \
              --input input --main-jar "ttplayer-1.0.0-${PLATFORM}.jar" \
              --main-class org.ttplayer.Main --icon "$ICON" --dest pkg_out
          fi

          # ===== Portable app bundles / 免安装 app 包（--type app-image，无需 WiX/fakeroot）=====
          # macOS → TTPlayer.app; Windows/Linux → TTPlayer/ green directory
          # macOS 产出 TTPlayer.app；Windows/Linux 产出 TTPlayer/ 绿色目录
          jpackage --type app-image --name TTPlayer --app-version 1.0.0 \
            --input input --main-jar "ttplayer-1.0.0-${PLATFORM}.jar" \
            --main-class org.ttplayer.Main --icon "$ICON" --dest app_out

          # Archive the app dir next to the installers / 压缩 app 目录到 pkg_out，与安装包一并上传
          if [[ "$PLATFORM" == macosx-* ]]; then
            (cd app_out && zip -qr "TTPlayer-${PLATFORM}-app.zip" TTPlayer.app)
          elif [[ "$PLATFORM" == windows-* ]]; then
            (cd app_out && powershell -NoProfile -Command \
              "Compress-Archive -Path TTPlayer -DestinationPath 'TTPlayer-${PLATFORM}-app.zip' -Force")
          else
            (cd app_out && tar -czf "ttplayer-${PLATFORM}-app.tar.gz" TTPlayer)
          fi
          mv app_out/*.zip app_out/*.tar.gz pkg_out/

          ls -lh pkg_out/

      - name: Upload installer as artifact / 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: pkg_out/*
          if-no-files-found: error

  # -------------------------------------------------------
  # release: publish GitHub Release on v* tags / 打标签时发布 GitHub Release
  # Needs write permission on contents to create/update the Release and upload assets
  # (the default GITHUB_TOKEN is read-only).
  # 创建/更新 Release 及上传附件需要写权限（默认 GITHUB_TOKEN 是只读）。
  # -------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, package ]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download jars / 下载 jar
        uses: actions/download-artifact@v4
        with:
          pattern: ttplayer-jar-*
          path: dist
          merge-multiple: true

      - name: Download installers / 下载安装包
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/installer
          merge-multiple: true

      - name: List release assets / 列出 Release 附件
        run: find dist -type f | sort

      - name: Create GitHub Release / 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TTPlayer ${{ github.ref_name }}
          body: |
            # TTPlayer ${{ github.ref_name }}
            ## 可执行 fat jar（JDK 25+，`java -jar` 直接运行） / Runnable fat jars

            | Platform / 平台 | File / 文件 |
            |------|------|
            | macOS Intel | `ttplayer-1.0.0-macosx-x86_64.jar` |
            | macOS Apple Silicon | `ttplayer-1.0.0-macosx-arm64.jar` |
            | Windows x64 | `ttplayer-1.0.0-windows-x86_64.jar` |
            | Linux x64 | `ttplayer-1.0.0-linux-x86_64.jar` |
            | Linux ARM64 | `ttplayer-1.0.0-linux-arm64.jar` |

            ## 原生安装包（jpackage，免安装 JDK） / Native installers (bundled JDK)

            | Platform / 平台 | Package / 包 | Notes / 说明 |
            |------|------|------|
            | Windows x64 | `.msi` | 安装后自带开始菜单/桌面快捷方式 · adds Start menu & desktop shortcut |
            | Windows x64 | `.exe` | 安装引导程序 · setup bootstrapper |
            | macOS Apple Silicon | `.dmg` | 拖入 Applications 即可 · drag into Applications |
            | Linux x64 | `.deb` | `sudo dpkg -i` 安装 |
            | Linux ARM64 | `.deb` | `sudo dpkg -i` 安装 |

            **macOS Intel 用户**：请使用上面 jar `ttplayer-1.0.0-macosx-x86_64.jar`，以 JDK 25 运行（`java -jar`）。
            **_For macOS Intel_**: use the jar `ttplayer-1.0.0-macosx-x86_64.jar` from the table above and run with JDK 25 (`java -jar`).

            ## 免安装 App 包（jpackage app-image，解压即用） / Portable app bundles

            | Platform / 平台 | File / 文件 | Notes / 说明 |
            |------|------|------|
            | macOS Apple Silicon | `.app` zip | 解压后把 `TTPlayer.app` 拖入 Applications · unzip → drag into Applications |
            | Windows x64 | 绿色版 zip | 解压后运行 `TTPlayer/bin/TTPlayer.exe` |
            | Linux x64 | tar.gz | 解压后运行 `TTPlayer/bin/TTPlayer` |
            | Linux ARM64 | tar.gz | 解压后运行 `TTPlayer/bin/TTPlayer` |

            > 配置存储于 `~/.ttplayer/`（Windows `%USERPROFILE%\.ttplayer`）。
            > Config is stored in `~/.ttplayer/`. macOS 未签名，首次启动如被拦截请在系统设置中允许，或右键 → 打开。
            > macOS is unsigned — if blocked on first launch, allow it in System Settings or right-click → Open.
          files: |
            dist/*.jar
            dist/installer/*